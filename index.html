<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yod-Si is a pixel creation studio by KAMINARI.">
  <title>Yod-Si — Pixel Creation Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --panel: rgba(16, 21, 38, 0.78);
      --text: #f8f8ff;
      --muted: #aab1c8;
      --line: rgba(255, 255, 255, 0.1);
      --pink: #ff4fa3;
      --violet: #855cff;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 14% 18%, rgba(255,79,163,.2), transparent 28rem),
        radial-gradient(circle at 86% 72%, rgba(34,211,238,.14), transparent 30rem),
        var(--bg);
      background-size: 32px 32px, 32px 32px, auto, auto, auto;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 14rem;
      height: 14rem;
      border: 1px solid var(--line);
      transform: rotate(18deg);
    }

    body::before { top: -7rem; right: 8%; }
    body::after { bottom: -8rem; left: 7%; transform: rotate(42deg); }

    .page {
      width: min(1120px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0;
      color: var(--muted);
      font-size: .9rem;
      letter-spacing: .08em;
    }

    .brand {
      color: var(--text);
      font-weight: 800;
      letter-spacing: .14em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }

    main {
      display: grid;
      place-items: center;
      padding: 72px 0 92px;
    }

    .hero {
      position: relative;
      width: 100%;
      padding: clamp(34px, 7vw, 86px);
      border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--panel), rgba(9, 12, 23, .92));
      box-shadow: 0 35px 100px rgba(0,0,0,.4);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -1px auto -1px -1px;
      width: 5px;
      background: linear-gradient(var(--pink), var(--violet), var(--cyan));
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--cyan);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(4.2rem, 14vw, 10rem);
      line-height: .82;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(90deg, var(--pink), #b15cff 52%, var(--cyan));
      background-clip: text;
      -webkit-background-clip: text;
    }

    h2 {
      margin: 38px 0 14px;
      font-size: clamp(1.45rem, 3vw, 2.35rem);
      line-height: 1.18;
      letter-spacing: -.03em;
    }

    .intro {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.16rem);
      line-height: 1.75;
    }

    .coming-soon {
      display: inline-flex;
      align-items: center;
      margin-top: 34px;
      padding: 13px 18px;
      border: 1px solid rgba(133,92,255,.55);
      background: rgba(133,92,255,.1);
      color: #dcd3ff;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    footer {
      border-top: 1px solid var(--line);
      letter-spacing: normal;
    }

    footer p { margin: 0; }

    @media (max-width: 640px) {
      .page { width: min(100% - 26px, 1120px); }
      header, footer { align-items: flex-start; flex-direction: column; }
      main { padding: 36px 0 56px; }
      .hero { padding: 38px 27px 42px 32px; }
      h1 { font-size: clamp(3.55rem, 22vw, 6rem); }
      h2 { margin-top: 30px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero { animation: reveal .65s ease-out both; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">KAMINARI</div>
      <div class="status">In development</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="product-name">
        <p class="eyebrow">Pixel Creation Studio</p>
        <h1 id="product-name">Yod<span>-Si</span></h1>
        <h2>Pixel art, ready for your game.</h2>
        <p class="intro">
          Draw, organize, animate, and export game-ready pixel assets
          through one structured workflow.
        </p>
        <div class="coming-soon">Coming soon</div>
      </section>
    </main>

    <footer>
      <p>Created by KAMINARI</p>
      <p>Copyright © 2026 KAMINARI. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
